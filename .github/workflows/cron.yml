name: Run expired challenge cleanup

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Run SQL function
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c "SELECT deactivate_expired_challenges();"